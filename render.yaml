services:
  - type: web
    name: cronograma-bcm
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cronograma-bcm-db
          property: connectionString

databases:
  - name: cronograma-bcm-db
    databaseName: cronograma_bcm
    plan: free
